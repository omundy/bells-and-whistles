    <script>
      // ─── Visualizer (shows whatever sound is currently playing) ────────────────
      const canvas = document.getElementById("canvas");
      const canvasContext = canvas.getContext("2d");
      let animationId;

      const drawFps = 16; // lower = slower, easier to read waveform shape
      const drawInterval = 1000 / drawFps;
      let lastDrawTime = 0;

      function draw(now = 0) {
        animationId = requestAnimationFrame(draw);
        if (now - lastDrawTime < drawInterval) return;
        lastDrawTime = now;

        const analyser = bus();
        const dataArray = busData();
        analyser.getByteTimeDomainData(dataArray);

        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        canvasContext.fillStyle = "white";
        canvasContext.fillRect(0, 0, canvas.width, canvas.height);

        canvasContext.lineWidth = 2;
        canvasContext.strokeStyle = "black";
        canvasContext.beginPath();

        const sliceWidth = canvas.width / dataArray.length;
        let x = 0;
        let maxY = 0;

        for (let i = 0; i < dataArray.length; i++) {
          const v = dataArray[i] / 128.0;
          const y = (v * canvas.height) / 2;
          if (y > maxY) maxY = y;

          if (i === 0) {
            canvasContext.moveTo(x, y);
          } else {
            canvasContext.lineTo(x, y);
          }
          x += sliceWidth;
        }
        // if (maxY > 100)
          canvasContext.stroke();
      }

      function startVisualizer() {
        if (!animationId) draw();
      }
    </script>

    <script>
      // ─── Audio Context ─────────────────────────────────────────────────────────
      let _ctx = null;
      function ctx() {
        if (!_ctx) {
          _ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (_ctx.state === "suspended") _ctx.resume();
        return _ctx;
      }

      // ─── Visualizer bus ────────────────────────────────────────────────────────
      // All sounds connect here (instead of straight to c.destination) so the
      // canvas visualizer can see whatever bell/whistle is currently playing.
      let _analyser = null;
      let _analyserData = null;
      function bus() {
        const c = ctx();
        if (!_analyser) {
          _analyser = c.createAnalyser();
          _analyser.fftSize = 1024;
          _analyserData = new Uint8Array(_analyser.fftSize);
          _analyser.connect(c.destination);
        }
        return _analyser;
      }
      function busData() {
        bus();
        return _analyserData;
      }

      function osc(freq, type, gainVal, startT, stopT, destNode) {
        const c = ctx(),
          o = c.createOscillator(),
          g = c.createGain();
        o.type = type;
        o.frequency.value = freq;
        o.connect(g);
        g.connect(destNode || bus());
        g.gain.setValueAtTime(gainVal, startT);
        g.gain.exponentialRampToValueAtTime(0.001, stopT);
        o.start(startT);
        o.stop(stopT + 0.01);
        return { osc: o, gain: g };
      }

      function bell(freq, vol, delay, dur, harmonics = [1, 2.756, 5.404]) {
        const c = ctx(),
          t = c.currentTime + delay;
        harmonics.forEach((h, i) => {
          osc(freq * h, "sine", vol / (i * 0.8 + 1), t, t + dur, bus());
        });
      }

            g.gain.setValueAtTime(0.001, t);

          o.frequency.linearRampToValueAtTime(500, t + 1.1);
          g.gain.linearRampToValueAtTime(0.2,      t + 1.2);

          o.frequency.setValueAtTime(500,             t + 1.4);

          o.frequency.setValueAtTime(2000,             t + 1.7);

          o.frequency.linearRampToValueAtTime(1000, t + 1.8);

          o.frequency.linearRampToValueAtTime(500, t + 2.2);

          o.frequency.linearRampToValueAtTime(250, t + 2.4);

      // ─── Dial SVG Builder ────────────────────────────────────────────────────────
      function buildDial(id, iconSVG) {
        const S = 110,
          cx = 55,
          cy = 55,
          R = 45;
        // Angle formula: n=0 → 120° (7-o'clock), n=11 → 420° (5-o'clock)
        // angleForN = 120 + (n/11)*300   (in SVG degrees, clockwise from 3-o'clock)
        function angleForN(n) {
          return 120 + (n / 11) * 300;
        }
        function pt(angleDeg, radius) {
          const a = (angleDeg * Math.PI) / 180;
          return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
        }

        let svg = `<svg id="dial-${id}" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg">`;

        // // Outer circle
        // svg += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="white" stroke="#111" stroke-width="1.8"/>`;

        // // Minor ticks (55 intervals)
        // for (let t = 0; t <= 55; t++) {
        //   if (t % 5 === 0) continue;
        //   const a = 120 + (t / 55) * 300;
        //   const [x1, y1] = pt(a, R - 1.5);
        //   const [x2, y2] = pt(a, R - 5);

        // }

        // // Major ticks & numbers (0–11)
        // for (let n = 0; n <= 11; n++) {
        //   const a = angleForN(n);
        //   const [x1, y1] = pt(a, R - 1.5);
        //   const [x2, y2] = pt(a, R - 8);
        //   const [nx, ny] = pt(a, R - 16);
        //   svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#111" stroke-width="1.5"/>`;
        //   svg += `<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="7.5" font-family="Patrick Hand,sans-serif" font-weight="bold">${n}</text>`;
        // }

        // // Icon (centered)
        // svg += `<g transform="translate(${cx},${cy})" style="pointer-events:none">${iconSVG}</g>`;

        // Pivot
        svg += `<circle cx="${cx}" cy="${cy}" r="3.5" fill="#111"/>`;

        // Needle at rest (n=0, angle=120°)
        const [nx0, ny0] = pt(120, R - 20);
        svg += `<line id="needle-${id}" x1="${cx}" y1="${cy}" x2="${nx0.toFixed(1)}" y2="${ny0.toFixed(1)}" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>`;
        svg += `<circle cx="${cx}" cy="${cy}" r="2.5" fill="#111"/>`;

        svg += `</svg>`;
        return svg;
      }

      // ─── Needle Animation ────────────────────────────────────────────────────────
      function animateNeedle(id, soundDuration) {
        const needle = document.getElementById(`needle-${id}`);
        if (!needle) return;
        const cx = 55,
          cy = 55,
          R = 45,
          needleR = R - 20;
        const totalMs = soundDuration * 1000 || 2000;
        const swingMs = 180;
        const startAngle = 120;
        const peakAngle = 120 + (10.5 / 11) * 300; // near 11

        function setAngle(deg) {
          const a = (deg * Math.PI) / 180;
          const nx = cx + needleR * Math.cos(a),
            ny = cy + needleR * Math.sin(a);
          needle.setAttribute("x2", nx.toFixed(1));
          needle.setAttribute("y2", ny.toFixed(1));
        }

        // Spring physics — overshoot then settle
        let t0 = null;
        function frame(ts) {
          if (!t0) t0 = ts;
          const el = ts - t0;
          let angle;
          if (el < swingMs) {
            // Quick swing up with slight overshoot
            const p = el / swingMs;
            const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
            angle = startAngle + (peakAngle - startAngle) * ease * 1.05;
          } else {
            // Exponential decay back to 0
            const p = (el - swingMs) / (totalMs - swingMs);
            const decay = Math.exp(-3.5 * p);
            angle = startAngle + (peakAngle - startAngle) * decay;
          }
          setAngle(angle);
          if (el < totalMs + 200) requestAnimationFrame(frame);
          else setAngle(startAngle);
        }
        requestAnimationFrame(frame);
      }

      // ─── Sound durations (seconds) ───────────────────────────────────────────────
      const durations = {
        "church-bells": 5.5,
        "altar-bell": 3,
        "hand-bell": 2,
        "dinner-bell": 1.8,
        cowbell: 1.2,
        doorbell: 1.6,
        "bicycle-bell": 1.0,
        audiocassette: 2.8,
        "alarm-bells": 2.5,

        "train-whistle": 2.2,
        "referees-whistle": 0.9,
        "police-whistle": 1.3,

        "wolf-whistle": 2.8,
        "swanee-whistle": 2.1,
        "kettle-whistle": 2.3,
        "breaktime-whistle": 2.5,
      };

      // ─── Render ───────────────────────────────────────────────────────────────────
      function renderItem(item, container) {
        const div = document.createElement("div");
        div.className = "item";
        div.id = `item-${item.id}`;

        const wrap = document.createElement("div");
        wrap.className = "dial-wrap";
        wrap.innerHTML = buildDial(item.id, item.icon);


        const bg = document.createElement("div");
        bg.className = "dial-bg";
        bg.innerHTML = `<img src="img/${item.id}.png" class="dial-bg" alt="" />`;

        const lbl = document.createElement("div");
        lbl.className = "label";
        lbl.innerHTML = item.label.replace(/\n/g, "<br>");

        if (item.dogNote) {
          const note = document.createElement("div");
          note.className = "dog-note";
          note.textContent = "inaudible!";
          div.appendChild(note);
        }

        div.appendChild(bg);
        div.appendChild(wrap);
        div.appendChild(lbl);

        let playing = false;
        div.addEventListener("click", () => {
          const fn = sounds[item.id];
          if (!fn) return;
          fn();
          const dur = durations[item.id] || 2;
          animateNeedle(item.id, dur);
          startVisualizer();
          if (!playing) {
            playing = true;
            div.classList.add("ringing");
            setTimeout(() => {
              div.classList.remove("ringing");
              playing = false;
            }, dur * 1000);
          }
        });

        container.appendChild(div);
      }

      const bellsEl = document.getElementById("bells");
      const whistlesEl = document.getElementById("whistles");
      bells.forEach((item) => renderItem(item, bellsEl));
      whistles.forEach((item) => renderItem(item, whistlesEl));
    </script>
